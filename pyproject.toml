[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "automata-extensions"
version = "0.1.0"
description = "Extensions pédagogiques par mixins pour automata-lib 9.2.0 (automates finis, expressions régulières, grammaires régulières et visualisation)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "automata-lib==9.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
visual = [
    "graphviz>=0.20",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["automata_extensions*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]